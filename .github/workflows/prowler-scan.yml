name: Cloud Security Posture Audit

on:
  schedule:
    - cron: '0 0 * * 0' # Run automatically every Sunday at midnight
  workflow_dispatch: # Allow running the scan manually from the GitHub Actions tab

permissions:
  contents: write # Required to push the HTML report to the gh-pages branch

jobs:
  prowler-audit:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install Trivy (Dependency for Prowler IaC)
      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      # 4. Install Prowler
      - name: Install Prowler
        run: |
          pip install prowler

      # 5. Execute Prowler IaC (Static Analysis) Scan
      # - We scan the local dummy-iac directory
      # - Output HTML format (-M html) into public directory
      - name: Run Prowler IaC Scan
        run: |
          prowler iac \
            --scan-path ./dummy-iac \
            -M html \
            -o ./public \
            -F index

      # 6. Deploy the generated HTML report to GitHub Pages
      - name: Deploy Dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
